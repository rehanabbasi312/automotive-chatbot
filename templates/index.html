<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Automotive AI</title>
    <!-- Meta Tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="keywords" content="Responsive Website Design, landing page, Portfolio, Business, E-commerce">
    <meta name="description" content="Responsive Website Design & Development">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="rebots" content="index, archive">
    <link rel="canonical" href="https://www.example.com">
    <!-- Google Fonts -->
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.ico') }}">


    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">


</head>

<body>
    <!-- loader -->
    <div class="loaders">
        <div class="loader"></div>
    </div>
    <!-- loader -->

    <!-- header -->
    <header class="header-area">
        <div class="containers">
            <div class="row">
                <div class="col-12">
                    <div class="navigation">
                        <nav class="navbar navbar-expand-xl">
                            <div class="container-fluid  p-0">
                                <a class="navbar-brand" href="/index"><img class="img-fluid"
                                        src="{{ url_for('static', filename='img/logo.svg') }}" alt="logo"></a>

                                <div class="location">
                                    <p><i class="bi bi-geo-alt-fill"></i> Kansas City </p>
                                    <input type="text" class="form-control" placeholder="Zip Code">
                                </div>

                                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                                    aria-expanded="false" aria-label="Toggle navigation">
                                    <span class="navbar-toggler-icon mobilebtn"><i class="bi bi-text-right"></i> </span>
                                </button>
                                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                                    <ul id="main-menu" class="navbar-nav me-auto sm sm-simple">
                                        <li><a href="/login">Sign up / Log in</a></li>
                                        <li><a href="#" class="dealerslog">Dealers Log in</a></li>
                                    </ul>
                                </div>
                            </div>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <!-- header -->



    <!-- main-content -->
    <main class="main-content">

        <!-- search-area -->
        <section class="search-area home">
            <div class="containers">

                <div class="row justify-content-center">
                    <div class="col-md-12 col-lg-10 col-xl-10">
                        <div class="title">
                            <p>Your Car Shopping AI Assistant </p>
                            <h1>What <span>Car</span> Are You Looking For?</h1>
                        </div>


                        <div class="prompt-clearbtn">
                            <button>Clear</button>
                        </div>

                        <!-- text-prompt -->
                        <div class="text-prompt">

                            <textarea class="form-control" rows="4"
                                placeholder="Write here what car do you want? "></textarea>

                            <!-- <div class="showmore " v-if="prompt.length> 800">
                                <button>Show more <i class="bi bi-chevron-down"></i></button>
                            </div> -->

                            <div class="row">
                                <div class="col-sm-12 col-md-10">

                                </div>
                                <div class="col-sm-12 col-md-2">
                                    <div class="voice">
                                        <button><i class="bi bi-mic-fill"></i></button>
                                        <button id="submit-btn" class="ups"><i class="bi bi-arrow-up-right"></i></button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- text-prompt -->


                        <div class="cannames">

                            <div class="title">
                                <h2>Popular Make</h2>
                            </div>

                            <ul>
                                {% for make in makes %}
                                <li>
                                    <a href="/model/{{ make }}">{{ make }}</a>
                                </li>
                                {% endfor %}
                            </ul>

                        </div>

                    </div>
                </div>

            </div>
        </section>
        <!-- search-area -->

    </main>
    <!-- main-content -->




    <!-- footer -->
    <footer class="footer-area">
        <div class="containers">
            <div class="row">
                <div class="col-md-6">
                    <div class="copy">
                        <p>Copyright © 2024 Automotiveai.com</p>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="trams">
                        <p><a href="#">Privacy Policy</a> | <a href="#">Terms & Conditions</a></p>
                    </div>
                </div>
            </div>
        </div>


        <div class="col-12">
            <a href="#" class="scrolltotop"><i class="bi bi-arrow-up-circle"></i></a>
        </div>
    </footer>
    <!-- footer -->



    <!-- Js script links-->
    <script src="{{ url_for('static', filename='js/code.jquery.com_jquery-3.7.0.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/jquery.smartmenus.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/jquery-ui.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/jquery.magnific-popup.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/slick.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/calendar.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

    <script>
        // Get the button element
        const submitButton = document.getElementById('submit-btn');
    
        // Add event listener to button click
        submitButton.addEventListener('click', function() {
            // Redirect to the '/chat' route when the button is clicked
            window.location.href = '/home';
        });
    </script>
    


</body>

</html>
