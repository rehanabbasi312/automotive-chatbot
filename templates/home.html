<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automotive AI - Dotless Automotive Assistant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script> <!-- Add this script here -->

</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1><i class="fas fa-car"></i> Automotive AI</h1>
                <button id="new-chat" class="new-chat-btn"><i class="fas fa-plus"></i> New Chat</button>
            </div>

            <div id="chat-history" class="chat-history"></div>
            
            <button id="clear-history" class="clear-history-btn"><i class="fas fa-trash"></i> Clear History</button>
            
        </aside>
        <main class="main-content">
            <div class="chat-container">
                <div id="message-container" class="message-container"></div>
                <div class="input-container">
                    <textarea id="user-input" placeholder="Chat with Automotive AI..." rows="1"></textarea>
                    <button id="send-button" class="send-btn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </main>
    </div>
    <div id="loading-indicator" class="loading-indicator">
        <i class="fas fa-spinner fa-spin"></i>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>


    
</body>
</html>
